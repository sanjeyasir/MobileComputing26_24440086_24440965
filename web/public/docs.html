<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutter IoT API v3.0 | Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    body { margin: 0; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .topbar-branding { background: #0b1120; border-bottom: 2px solid #10b981; color: white; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .topbar-branding h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
    .topbar-branding .badge { background: #065f46; color: #6ee7b7; padding: 3px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .topbar-branding .subtext { font-size: 0.85rem; color: #94a3b8; margin-top: 2px; }
    .swagger-ui { background: #f8fafc; padding: 20px 0; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 20px 0; }
  </style>
</head>
<body>
  <div class="topbar-branding">
    <div>
      <h1>
        <span>⚙️ Toyo Cushion Lanka — Cutter IoT API</span>
        <span class="badge">v3.0 • Post 1 = 2 Cuts & Downtime API</span>
      </h1>
      <div class="subtext">Hayleys Eco Solutions Sector • Hourly Volume & Downtime Management</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="/" style="color: #e2e8f0; text-decoration: none; font-size: 0.85rem; font-weight: 600; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px;">
        ← Back to Dashboard
      </a>
      <a href="/openapi.json" target="_blank" style="color: #34d399; text-decoration: none; font-size: 0.85rem; font-weight: 600; border: 1px solid #059669; padding: 6px 12px; border-radius: 6px;">
        📄 Raw OpenAPI Spec
      </a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list"
      });
    };
  </script>
</body>
</html>
